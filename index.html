<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>I Love You ❤️</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#ff9a9e,#fad0c4);display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden}
.card{text-align:center;background:#fff;padding:30px;border-radius:20px;box-shadow:0 10px 25px rgba(0,0,0,.2);position:relative}
h1{color:#e91e63}button{padding:12px 24px;margin:10px;border:none;border-radius:25px;font-size:18px;cursor:pointer}
#yes{background:#4caf50;color:#fff}#no{background:#f44336;color:#fff;position:relative}
#result{display:none}img{max-width:250px;border-radius:12px}
</style></head>
<body>
<div class="card">
<div id="question">
<h1>Do you love me? ❤️</h1>
<button id="yes">Yes</button><button id="no">No</button>
</div>
<div id="result">
<h1>I Love You Too! 💖</h1>
<img src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif" alt="love">
</div>
</div>
<script>
const no=document.getElementById('no');
no.addEventListener('mouseover',()=>{
 const x=Math.random()*(window.innerWidth-120);
 const y=Math.random()*(window.innerHeight-60);
 no.style.position='fixed';no.style.left=x+'px';no.style.top=y+'px';
});
document.getElementById('yes').onclick=()=>{
document.getElementById('question').style.display='none';
document.getElementById('result').style.display='block';
};
</script></body></html>
